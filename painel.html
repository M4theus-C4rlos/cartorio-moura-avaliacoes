<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Avaliações – Cartório Moura</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0e0c;
      --surface: #1a1814;
      --surface2: #201e19;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-dim: #7a6330;
      --text: #f0ead8;
      --text-muted: #8a8070;
      --border: #2e2a22;
      --green: #4caf7a;
      --red: #e07070;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      background-image:
        radial-gradient(ellipse at 10% 0%, rgba(201,168,76,0.07) 0%, transparent 45%),
        radial-gradient(ellipse at 90% 100%, rgba(201,168,76,0.04) 0%, transparent 45%);
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.5s ease both;
    }

    .logo-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .logo-line::before, .logo-line::after {
      content: '';
      height: 1px;
      width: 50px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }
    .logo-line::after { background: linear-gradient(to left, transparent, var(--gold-dim)); }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--gold-light);
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 0.35rem;
    }

    /* Botão atualizar */
    .top-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
      gap: 0.75rem;
      flex-wrap: wrap;
      animation: fadeUp 0.6s ease both;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--gold-dim); color: var(--gold); }

    .btn-primary {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--bg);
      font-weight: 500;
    }

    .btn-primary:hover { background: var(--gold-light); border-color: var(--gold-light); color: var(--bg); }

    /* Cards de resumo geral */
    .resumo {
      display: flex;
      gap: 1rem;
      max-width: 700px;
      margin: 0 auto 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.7s ease both;
    }

    .resumo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      text-align: center;
      flex: 1;
      min-width: 130px;
    }

    .resumo-valor {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--gold);
      line-height: 1;
    }

    .resumo-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.3rem;
    }

    /* Tabela de funcionários */
    .tabela-wrap {
      max-width: 700px;
      margin: 0 auto 2.5rem;
      animation: fadeUp 0.8s ease both;
    }

    .tabela-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 1rem;
      padding-left: 0.25rem;
    }

    .func-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.2s;
    }

    .func-card:hover { border-color: var(--gold-dim); }

    .rank {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--gold-dim);
      width: 20px;
      flex-shrink: 0;
      text-align: center;
    }

    .rank.top { color: var(--gold); }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      flex-shrink: 0;
    }

    .func-info {
      flex: 1;
    }

    .func-nome {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .barra-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .barra-bg {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .barra-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(to right, var(--gold-dim), var(--gold));
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    .barra-pct {
      font-size: 0.72rem;
      color: var(--text-muted);
      width: 28px;
      text-align: right;
    }

    .func-stats {
      text-align: right;
      flex-shrink: 0;
    }

    .nota-grande {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1;
    }

    .atendimentos {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Avaliações recentes */
    .recentes-wrap {
      max-width: 700px;
      margin: 0 auto;
      animation: fadeUp 0.9s ease both;
    }

    .avaliacao-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .av-nota {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--gold);
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .av-info .av-func {
      font-size: 0.88rem;
      font-weight: 500;
    }

    .av-info .av-comentario {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .av-data {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Loading / vazio */
    .status-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-line"><span>⚖️</span></div>
    <h1>Cartório Moura</h1>
    <div class="subtitle">Painel de Avaliações</div>
  </header>

  <div class="top-bar">
    <button class="btn btn-primary" onclick="carregarDados()">↻ Atualizar dados</button>
  </div>

  <!-- Resumo geral -->
  <div class="resumo">
    <div class="resumo-card">
      <div class="resumo-valor" id="total-avaliacoes">–</div>
      <div class="resumo-label">Avaliações</div>
    </div>
    <div class="resumo-card">
      <div class="resumo-valor" id="media-geral">–</div>
      <div class="resumo-label">Nota Média</div>
    </div>
    <div class="resumo-card">
      <div class="resumo-valor" id="melhor-func">–</div>
      <div class="resumo-label">Melhor Avaliado</div>
    </div>
  </div>

  <!-- Ranking funcionários -->
  <div class="tabela-wrap">
    <div class="tabela-titulo">Ranking de Funcionários</div>
    <div id="ranking-container">
      <div class="status-msg"><span class="spinner"></span> Carregando...</div>
    </div>
  </div>

  <!-- Avaliações recentes -->
  <div class="recentes-wrap">
    <div class="tabela-titulo">Avaliações Recentes</div>
    <div id="recentes-container">
      <div class="status-msg">–</div>
    </div>
  </div>

  <footer>Cartório Moura · Painel Interno</footer>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhQ-Rd2U9Hz6L89xMiuykqQLXgjIByT_BC4-FGTmv8dhAskKQNTWvfCQdE3Rd909Ln_L64uyvISlTQ/pub?gid=0&single=true&output=csv';

    const FUNCIONARIOS = [
      'Ryan Vasconcelos',
      'Flaviana Farias',
      'Diogo Moraes',
      'Michael Viana',
      'Quérsia Linhares'
    ];

    function iniciais(nome) {
      return nome.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
    }

    function formatarData(str) {
      if (!str) return '';
      const d = new Date(str);
      if (isNaN(d)) return str;
      return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    }

    async function carregarDados() {
      document.getElementById('ranking-container').innerHTML = '<div class="status-msg"><span class="spinner"></span> Carregando...</div>';
      document.getElementById('recentes-container').innerHTML = '<div class="status-msg">–</div>';

      try {
        const res = await fetch(SHEET_CSV_URL + '&cacheBust=' + Date.now());
        const text = await res.text();
        const linhas = text.trim().split('\n').slice(1); // pula cabeçalho

        if (linhas.length === 0 || (linhas.length === 1 && linhas[0].trim() === '')) {
          document.getElementById('ranking-container').innerHTML = '<div class="status-msg">Nenhuma avaliação ainda.</div>';
          return;
        }

        const avaliacoes = linhas.map(l => {
          const cols = l.split(',');
          return {
            timestamp: cols[0] || '',
            funcionario: (cols[1] || '').trim().replace(/^"|"$/g,''),
            nota: parseFloat((cols[2] || '0').trim()),
            comentario: (cols[3] || '').trim().replace(/^"|"$/g,'')
          };
        }).filter(a => a.funcionario);

        // Stats gerais
        const total = avaliacoes.length;
        const mediaGeral = total > 0 ? (avaliacoes.reduce((s,a) => s + a.nota, 0) / total).toFixed(1) : '–';
        document.getElementById('total-avaliacoes').textContent = total;
        document.getElementById('media-geral').textContent = mediaGeral;

        // Stats por funcionário
        const stats = {};
        FUNCIONARIOS.forEach(f => { stats[f] = { soma: 0, count: 0 }; });

        avaliacoes.forEach(a => {
          if (stats[a.funcionario]) {
            stats[a.funcionario].soma += a.nota;
            stats[a.funcionario].count++;
          }
        });

        const ranking = FUNCIONARIOS.map(f => ({
          nome: f,
          media: stats[f].count > 0 ? (stats[f].soma / stats[f].count) : null,
          atendimentos: stats[f].count
        })).sort((a, b) => {
          if (a.media === null && b.media === null) return 0;
          if (a.media === null) return 1;
          if (b.media === null) return -1;
          return b.media - a.media;
        });

        document.getElementById('melhor-func').textContent = ranking[0].media !== null
          ? ranking[0].nome.split(' ')[0]
          : '–';

        // Renderizar ranking
        const rankContainer = document.getElementById('ranking-container');
        rankContainer.innerHTML = '';
        ranking.forEach((f, i) => {
          const media = f.media !== null ? f.media.toFixed(1) : '–';
          const pct = f.media !== null ? (f.media / 10) * 100 : 0;
          const card = document.createElement('div');
          card.className = 'func-card';
          card.innerHTML = `
            <div class="rank ${i === 0 ? 'top' : ''}">${i+1}°</div>
            <div class="avatar">${iniciais(f.nome)}</div>
            <div class="func-info">
              <div class="func-nome">${f.nome}</div>
              <div class="barra-wrap">
                <div class="barra-bg"><div class="barra-fill" style="width:${pct}%"></div></div>
                <div class="barra-pct">${pct > 0 ? Math.round(pct)+'%' : ''}</div>
              </div>
            </div>
            <div class="func-stats">
              <div class="nota-grande">${media}</div>
              <div class="atendimentos">${f.atendimentos} avaliação${f.atendimentos !== 1 ? 'ões' : ''}</div>
            </div>
          `;
          rankContainer.appendChild(card);
        });

        // Avaliações recentes (últimas 10)
        const recentes = [...avaliacoes].reverse().slice(0, 10);
        const recentesContainer = document.getElementById('recentes-container');
        if (recentes.length === 0) {
          recentesContainer.innerHTML = '<div class="status-msg">Nenhuma avaliação ainda.</div>';
        } else {
          recentesContainer.innerHTML = '';
          recentes.forEach(a => {
            const item = document.createElement('div');
            item.className = 'avaliacao-item';
            item.innerHTML = `
              <div class="av-nota">${a.nota}</div>
              <div class="av-info">
                <div class="av-func">${a.funcionario}</div>
                ${a.comentario ? `<div class="av-comentario">"${a.comentario}"</div>` : ''}
              </div>
              <div class="av-data">${formatarData(a.timestamp)}</div>
            `;
            recentesContainer.appendChild(item);
          });
        }

      } catch (e) {
        document.getElementById('ranking-container').innerHTML =
          '<div class="status-msg">⚠️ Erro ao carregar dados. Verifique a URL do CSV.</div>';
      }
    }

    carregarDados();
  </script>
</body>
</html>
